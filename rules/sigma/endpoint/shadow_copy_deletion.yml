title: Volume Shadow Copy Deletion
id: d0be2124-dbfc-44bf-b446-1f7a813681a8
status: test
description: Detects deletion of Volume Shadow Copies with vssadmin or wmic, a common ransomware step to prevent recovery.
author: Dheeraj Shaik
logsource:
  category: process_creation
  product: windows
detection:
  selection_vssadmin:
    Image|endswith: '\vssadmin.exe'
    CommandLine|contains|all:
      - 'delete'
      - 'shadows'
  selection_wmic:
    Image|endswith: '\wmic.exe'
    CommandLine|contains|all:
      - 'shadowcopy'
      - 'delete'
  condition: 1 of selection_*
falsepositives:
  - Backup software rotating old snapshots
level: high
tags:
  - attack.impact
  - attack.t1490