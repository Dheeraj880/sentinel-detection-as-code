title: Certutil Used to Download a File
id: a9e7570d-b2ae-4dfc-bc68-e99c6a3e908c
status: test
description: Detects certutil.exe abused as a downloader via -urlcache or -verifyctl with a remote URL.
author: Dheeraj Shaik
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: '\certutil.exe'
  selection_flag:
    CommandLine|contains:
      - 'urlcache'
      - 'verifyctl'
  selection_url:
    CommandLine|contains:
      - 'http://'
      - 'https://'
  condition: all of selection_*
falsepositives:
  - Rare administrative use to fetch certificates from internal URLs
level: high
tags:
  - attack.command-and-control
  - attack.t1105