title: PowerShell Encoded Command Execution
id: 92549457-a6fb-41dc-9935-861374e711f9
status: test
description: Detects PowerShell launched with a Base64-encoded command, commonly used to hide malicious scripts from command-line logging.
author: Dheeraj Shaik
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_flag:
    CommandLine|contains:
      - ' -enc '
      - ' -encodedcommand '
      - ' -ec '
  condition: all of selection_*
falsepositives:
  - Some management agents and installers use encoded commands
level: medium
tags:
  - attack.execution
  - attack.t1059.001
  - attack.defense-evasion
  - attack.t1027