title: Regsvr32 Squiblydoo Scriptlet Execution
id: 6741b04d-69f4-480a-958b-11098a1ac7b2
status: test
description: Detects regsvr32.exe loading a scriptlet through scrobj.dll with /i:, which lets attackers run remote script code while bypassing application allowlisting.
author: Dheeraj Shaik
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: '\regsvr32.exe'
  selection_cli:
    CommandLine|contains|all:
      - '/i:'
      - 'scrobj.dll'
  condition: all of selection_*
falsepositives:
  - Very rare in legitimate use
level: high
tags:
  - attack.defense-evasion
  - attack.t1218.010