title: Password Spray Against Entra ID
id: 8cb2edad-4f4c-44ab-8eae-c09cd642f8ec
status: test
level: high
description: One IP failing sign-in for many different users in a short window (ResultType 50126 = invalid username or password).
author: Dheeraj Shaik
tags:
  - attack.credential-access
  - attack.t1110.003
query: |
  SigninLogs
  | where ResultType == "50126"
  | summarize FailedUsers = dcount(UserPrincipalName), Attempts = count(),
              FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated)
      by IPAddress, bin(TimeGenerated, 30m)
  | where FailedUsers >= 5