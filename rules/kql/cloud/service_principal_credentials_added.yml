title: Credentials Added to Application or Service Principal
id: aaac188e-7ee1-44f9-b3ce-62918e704e27
status: test
level: high
description: A secret or certificate was added to an application or service principal, which can give an attacker persistent access that survives user password resets.
author: Dheeraj Shaik
tags:
  - attack.persistence
  - attack.t1098.001
query: |
  AuditLogs
  | where Result == "success"
  | where OperationName contains "service principal credentials" or OperationName contains "Certificates and secrets management"
  | extend Actor = tostring(InitiatedBy.user.userPrincipalName), AppName = tostring(TargetResources[0].displayName)
  | project TimeGenerated, Actor, AppName, OperationName