version: 2

updates:
- package-ecosystem: pip
  directory: "/"
  schedule:
    interval: weekly
    day: monday
  labels: [dependencies, security]
  groups:
    python-dependencies:
      patterns: ["*"]
  # pysigma-backend-kusto 1.0.1 requires pysigma<2.0.0.
  # Hold major upgrades until the backend supports 2.x.
  ignore:
    - dependency-name: "pysigma"
      update-types: ["version-update:semver-major"]

# Keeps the commit-SHA pins on every GitHub Action up to date.
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
    day: monday
  labels: [dependencies, security]
  groups:
    github-actions:
      patterns: ["*"]