# Semgrep SAST: community Python, secrets and GitHub Actions rulesets.
# Findings are uploaded to the Security tab (Code scanning) for triage.

name: semgrep

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "29 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install "semgrep==1.182.0"

      - name: Scan
        run: >
          semgrep scan
          --config p/python
          --config p/secrets
          --config p/github-actions
          --sarif --output semgrep.sarif

      - name: Upload SARIF to code scanning
        # Fork PRs get a read-only token and cannot upload; skip there.
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep